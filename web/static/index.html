<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Contract Prediction Chat</title>
<style>
  /* "Scorebook" palette: pale sage ledger paper + ink navy, in the spirit of
     an old scorecard, with pine green (grass) as the primary accent and a
     dirt terracotta as a sparing secondary accent (stitching, bubble tabs,
     the typing indicator) -- never the dominant color. */
  :root {
    --bg: #eef2e7;
    --panel: #fbfcf8;
    --text: #1c2620;
    --text-muted: #5c6b5f;
    --border: #d7ddc9;
    --accent: #1f6f5c;
    --accent-2: #c1652f;
    --assistant-bubble: #fbfcf8;
    --assistant-text: #1c2620;
    --user-bubble: var(--accent);
    --user-text: #ffffff;
    --error: #b3261e;
    --error-bubble: #fbeae8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10160f;
      --panel: #171f16;
      --text: #e9ede4;
      --text-muted: #8fa389;
      --border: #29352a;
      --accent: #3fa98a;
      --accent-2: #e08a52;
      --assistant-bubble: #1c2419;
      --assistant-text: #e9ede4;
      --user-bubble: var(--accent);
      --user-text: #08130f;
      --error: #ff8a80;
      --error-bubble: #3a1f1d;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  header {
    padding: 1.1rem 1.5rem 0.9rem;
    border-bottom: 2px dashed color-mix(in srgb, var(--accent-2) 55%, transparent);
    background: var(--panel);
  }
  header h1 {
    margin: 0;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header p {
    margin: 0.25rem 0 0;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem 1rem;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }

  .row {
    display: flex;
    width: 100%;
  }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 75%;
    padding: 0.65rem 0.95rem;
    font-size: 0.95rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    color: var(--assistant-text);
    border-radius: 18px 18px 18px 4px;
    border-left: 3px solid var(--accent-2);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .row.assistant .bubble.error {
    background: var(--error-bubble);
    color: var(--error);
  }

  /* Typing indicator: sits where the reply will land, phase caption above
     three dots that bounce in sequence (iMessage-style). */
  .typing-caption {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
    min-height: 1em;
  }
  .dots {
    display: inline-flex;
    gap: 0.28rem;
    align-items: center;
    height: 0.9rem;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-2);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; opacity: 0.7; }
  }

  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  input[type=text] {
    flex: 1;
    padding: 0.65rem 0.9rem;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  input[type=text]:focus {
    border-color: var(--accent);
  }
  button {
    padding: 0.6rem 1.15rem;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 20px;
    background: var(--accent);
    color: var(--user-text);
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.05s ease;
  }
  button:hover:not(:disabled) {
    background: color-mix(in srgb, var(--accent) 85%, black);
  }
  button:active:not(:disabled) {
    transform: scale(0.97);
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>
<header>
  <h1>MLB Contract Prediction Chat</h1>
  <p>Ask about a player's projected or actual contract, e.g. "what will Corbin Burnes make in 2026?"</p>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Ask a question..." autofocus>
  <button type="submit">Send</button>
</form>

<script>
// Generated once up front (not waited on from the server) so the very first
// message already has a session_id to poll /api/status with.
let sessionId = crypto.randomUUID();
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const button = form.querySelector("button");

function addBubble(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

function addTypingBubble() {
  const row = document.createElement("div");
  row.className = "row assistant";
  row.innerHTML =
    '<div class="bubble">' +
    '  <span class="typing-caption">Thinking...</span>' +
    '  <span class="dots"><span></span><span></span><span></span></span>' +
    "</div>";
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addBubble("user", text);
  input.value = "";
  input.disabled = true;
  button.disabled = true;

  const typingRow = addTypingBubble();
  const caption = typingRow.querySelector(".typing-caption");

  const pollStatus = async () => {
    try {
      const resp = await fetch("/api/status?session_id=" + encodeURIComponent(sessionId));
      if (resp.ok) {
        const data = await resp.json();
        caption.textContent = data.status;
      }
    } catch (err) {
      // Non-fatal -- the status caption is a nicety, not required for the answer.
    }
  };
  const statusInterval = setInterval(pollStatus, 400);

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    typingRow.remove();
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      addBubble("assistant", "Error: " + (err.detail || resp.statusText)).classList.add("error");
      return;
    }
    const data = await resp.json();
    sessionId = data.session_id;
    addBubble("assistant", data.message);
  } catch (err) {
    typingRow.remove();
    addBubble("assistant", "Error: " + err).classList.add("error");
  } finally {
    clearInterval(statusInterval);
    input.disabled = false;
    button.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
